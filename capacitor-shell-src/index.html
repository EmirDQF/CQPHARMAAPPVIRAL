<!doctype html>
<html lang="es-PE">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src __SHELL_SCRIPT_HASH__" />
    <title>Sin conexión | Artikare</title>
    <style>
      body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;color:#0f172a;padding:16px;text-align:center;font-size:18px;line-height:1.5}
      main{max-width:28rem}
      button{margin-top:16px;min-height:48px;min-width:48px;padding:12px 24px;border:0;border-radius:12px;background:#0f766e;color:#fff;font-size:18px;font-weight:600}
      button:focus-visible{outline:3px solid #0f172a;outline-offset:3px}
      @media (prefers-color-scheme: dark){body{background:#0a0a0a;color:#f5f5f5}button:focus-visible{outline-color:#f5f5f5}}
    </style>
  </head>
  <body>
    <main>
      <h1>No pudimos abrir Artikare</h1>
      <p id="estado" role="status">Revisa tu conexión a internet e inténtalo de nuevo.</p>
      <button id="reintentar" type="button">Reintentar</button>
    </main>
    <!-- Plantilla: scripts/build-shell.mjs incrusta aquí la config y offline.js y fija el hash
         de la CSP. Con server.url, Capacitor 8 solo sirve localmente la URL exacta del
         errorPath: un <script src> iría por proxy al servidor caído y nunca cargaría. -->
    <script>__SHELL_SCRIPT__</script>
  </body>
</html>
