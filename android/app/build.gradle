apply plugin: 'com.android.application'

// capacitor.config.json lo genera `cap sync` según CAP_ENV (src/lib/env/capacitorEnv.ts).
def capacitorConfigFile = file("src/main/assets/capacitor.config.json")
def readCapacitorServer = {
    capacitorConfigFile.exists() ? (new groovy.json.JsonSlurper().parse(capacitorConfigFile).server ?: [:]) : [:]
}
ext.capacitorServerHost = {
    def url = readCapacitorServer().url
    url ? (new URI(url).host ?: "localhost") : "localhost"
}

// Guardia anti-contaminación (como verify-android-release --generated): ninguna tarea
// release empaqueta un sync de desarrollo, aunque se llame a gradlew directamente.
def assertReleaseCapacitorServer = {
    def server = readCapacitorServer()
    def url = server.url ? new URI(server.url) : null
    def host = url?.host ?: ""
    def isLocalHost = host == "localhost" || host ==~ /^[0-9.]+$/ || host.startsWith("[") ||
        host ==~ /.*\.(localhost|local|internal|lan)$/
    if (url?.scheme != "https" || server.cleartext == true || isLocalHost) {
        throw new GradleException("Release bloqueado: capacitor.config.json no apunta a un servidor https público " +
            "(¿quedó un sync de CAP_ENV=dev?). Usa npm run build:android.")
    }
}
tasks.matching { it.name == "preReleaseBuild" }.configureEach { task ->
    task.doFirst { assertReleaseCapacitorServer() }
}

android {
    namespace = "com.artikare.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.artikare.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Host de los App Links: el mismo servidor que cap sync horneó en el APK
        // (CAP_SERVER_URL de release). Sin sync todavía, "localhost": nunca un dominio inventado.
        manifestPlaceholders = [appLinkHost: capacitorServerHost()]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Firma de release: SOLO con el keystore del usuario (android/keystore.properties,
    // ignorado por git, o ANDROID_KEYSTORE_*). Sin él no hay firma; scripts/gradle.mjs
    // detiene bundleRelease antes con un mensaje claro.
    def keystorePropertiesFile = rootProject.file("keystore.properties")
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    }
    def signingValue = { String property, String envName ->
        keystoreProperties.getProperty(property) ?: System.getenv(envName)
    }
    def releaseStoreFile = signingValue("storeFile", "ANDROID_KEYSTORE_PATH")
    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile file(releaseStoreFile)
                storePassword signingValue("storePassword", "ANDROID_KEYSTORE_PASSWORD")
                keyAlias signingValue("keyAlias", "ANDROID_KEY_ALIAS")
                keyPassword signingValue("keyPassword", "ANDROID_KEY_PASSWORD")
            }
        }
    }
    // Ni llamando a gradlew directamente sale un AAB/APK de release sin firma.
    def missingSigning = ["storePassword": "ANDROID_KEYSTORE_PASSWORD", "keyAlias": "ANDROID_KEY_ALIAS",
                          "keyPassword": "ANDROID_KEY_PASSWORD"].findAll { property, envName -> !signingValue(property, envName) }
    tasks.matching { it.name == "preReleaseBuild" }.configureEach { task ->
        task.doFirst {
            if (!releaseStoreFile || !file(releaseStoreFile).exists() || !missingSigning.isEmpty()) {
                throw new GradleException("Release bloqueado: falta la firma del usuario. Crea android/keystore.properties " +
                    "(ignorado por git) o define ANDROID_KEYSTORE_*. Ver docs/RELEASE.md.")
            }
        }
    }
    buildTypes {
        release {
            if (releaseStoreFile) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
