apply plugin: 'com.android.application'

// capacitor.config.json lo genera `cap sync` según CAP_ENV (src/lib/env/capacitorEnv.ts).
def capacitorConfigFile = file("src/main/assets/capacitor.config.json")
def readCapacitorServer = {
    capacitorConfigFile.exists() ? (new groovy.json.JsonSlurper().parse(capacitorConfigFile).server ?: [:]) : [:]
}
// Modo empaquetado (CAP_MODE=bundled): sin server.url, la interfaz va dentro del APK y el
// dominio público de los App Links sale de NEXT_PUBLIC_SITE_URL.
def isBundledCapacitor = { !readCapacitorServer().url }
def siteUrlHost = {
    def site = System.getenv("NEXT_PUBLIC_SITE_URL")
    site ? new URI(site.trim()).host : null
}
ext.capacitorServerHost = {
    def url = readCapacitorServer().url
    url ? (new URI(url).host ?: "localhost") : (siteUrlHost() ?: "localhost")
}

// Guardia anti-contaminación (como verify-android-release --generated): ninguna tarea
// release empaqueta un sync de desarrollo, aunque se llame a gradlew directamente.
def isLocalHostName = { String host ->
    host == "localhost" || host ==~ /^[0-9.]+$/ || host.startsWith("[") || host ==~ /.*\.(localhost|local|internal|lan)$/
}
def assertReleaseCapacitorServer = {
    def server = readCapacitorServer()
    if (isBundledCapacitor()) {
        def host = (siteUrlHost() ?: "").replaceAll(/\.$/, "")
        if (server.cleartext == true || (server.androidScheme ?: "https") != "https" || !host || isLocalHostName(host)) {
            throw new GradleException("Release bloqueado: app empaquetada sin androidScheme https o sin " +
                "NEXT_PUBLIC_SITE_URL pública (host de los App Links). Usa npm run build:android.")
        }
        return
    }
    def url = server.url ? new URI(server.url) : null
    def host = (url?.host ?: "").replaceAll(/\.$/, "")  // "localhost." = "localhost"
    if (url?.scheme != "https" || server.cleartext == true || isLocalHostName(host)) {
        throw new GradleException("Release bloqueado: capacitor.config.json no apunta a un servidor https público " +
            "(¿quedó un sync de CAP_ENV=dev?). Usa npm run build:android.")
    }
}
tasks.matching { it.name == "preReleaseBuild" }.configureEach { task ->
    task.doFirst { assertReleaseCapacitorServer() }
}

// Versión única: package.json. Misma fórmula que src/lib/version/appVersion.ts;
// scripts/verify-version.mjs falla si alguien escribe aquí un número a mano.
def appVersionName = new groovy.json.JsonSlurper().parse(rootProject.file("../package.json")).version
def appVersionCode = { String version ->
    def match = version =~ /^(\d+)\.(\d+)\.(\d+)$/
    if (!match.matches()) {
        throw new GradleException("package.json: la versión \"${version}\" no es SemVer X.Y.Z.")
    }
    def (major, minor, patch) = (1..3).collect { match.group(it) as int }
    if (minor > 99 || patch > 99) {
        throw new GradleException("package.json: minor y patch deben ser <= 99 (versión ${version}).")
    }
    major * 10000 + minor * 100 + patch
}(appVersionName)

android {
    namespace = "com.artikare.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.artikare.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Host de los App Links: el mismo servidor que cap sync horneó en el APK
        // (CAP_SERVER_URL de release). Sin sync todavía, "localhost": nunca un dominio inventado.
        manifestPlaceholders = [appLinkHost: capacitorServerHost()]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Firma de release: SOLO con el keystore del usuario (android/keystore.properties,
    // ignorado por git, o ANDROID_KEYSTORE_*). Sin él no hay firma; scripts/gradle.mjs
    // detiene bundleRelease antes con un mensaje claro.
    def keystorePropertiesFile = rootProject.file("keystore.properties")
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    }
    def signingValue = { String property, String envName ->
        keystoreProperties.getProperty(property) ?: System.getenv(envName)
    }
    def releaseStoreFile = signingValue("storeFile", "ANDROID_KEYSTORE_PATH")
    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile file(releaseStoreFile)
                storePassword signingValue("storePassword", "ANDROID_KEYSTORE_PASSWORD")
                keyAlias signingValue("keyAlias", "ANDROID_KEY_ALIAS")
                keyPassword signingValue("keyPassword", "ANDROID_KEY_PASSWORD")
            }
        }
    }
    // Ni llamando a gradlew directamente sale un AAB/APK de release sin firma.
    def missingSigning = ["storePassword": "ANDROID_KEYSTORE_PASSWORD", "keyAlias": "ANDROID_KEY_ALIAS",
                          "keyPassword": "ANDROID_KEY_PASSWORD"].findAll { property, envName -> !signingValue(property, envName) }
    tasks.matching { it.name == "preReleaseBuild" }.configureEach { task ->
        task.doFirst {
            if (!releaseStoreFile || !file(releaseStoreFile).exists() || !missingSigning.isEmpty()) {
                throw new GradleException("Release bloqueado: falta la firma del usuario. Crea android/keystore.properties " +
                    "(ignorado por git) o define ANDROID_KEYSTORE_*. Ver docs/RELEASE.md.")
            }
        }
    }
    buildTypes {
        release {
            if (releaseStoreFile) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Aviso por Wi-Fi en segundo plano (ArtikoRemindersPlugin / WifiNudgeWorker).
    implementation "androidx.work:work-runtime:2.12.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
